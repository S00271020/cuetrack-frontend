<h2>Opponents</h2>

@if (loading()) {
  <p>Loading opponents…</p>
} @else if (errorMessage()) {
  <p role="alert">{{ errorMessage() }}</p>
} @else {
  <ul class="opponent-list">
    @for (opponent of opponents(); track opponent._id) {
      <li>
        <span>{{ opponent.name }}</span>
        <div class="opponent-actions">
          <a class="editButton">Edit Opponent</a>
          <a class="deleteButton" (click)="deleteOpponent(opponent._id)">Delete Opponent</a>
        </div>
      </li>
    } @empty {
      <li>No opponents yet.</li>
    }
  </ul>
  <a class="addButton" routerLink="/opponents/new">Add Opponent</a>
}
